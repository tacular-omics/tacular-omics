[project]
name = "tacular-omics"
dynamic = ["version"]
description = "Install the tacular-omics proteomics packages together."
readme = "README.md"
requires-python = ">=3.12"
# The tested set of released member packages. Each has a floor (the release this set
# was tested with) and a cap (the next major, or next minor for 0.x packages).
dependencies = [
    "tacular>=2.0,<3",
    "psimodpy>=1.1,<2",
    "unimodpy>=1.1,<2",
    "uniprotptmpy>=1.1,<2",
    "fastatacular>=1.1,<2",
    "pefftacular>=1.1,<2",
    "mzmlpy>=0.10,<0.11",
    "tdfpy>=5.0,<6",
    "peptacular>=5.0,<6",
    "paftacular>=2.0,<3",
    "spxtacular>=0.9,<0.10",
]
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["proteomics", "mass spectrometry", "bioinformatics", "proforma", "mzml", "mzpaf", "fasta"]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The MCP servers of every member package that ships one.
mcp = [
    "psimodpy[server]>=1.1,<2",
    "unimodpy[server]>=1.1,<2",
    "uniprotptmpy[server]>=1.1,<2",
    "mzmlpy[mcp]>=0.10,<0.11",
    "tdfpy[mcp]>=5.0,<6",
    "peptacular[mcp]>=5.0,<6",
    "paftacular[mcp]>=2.0,<3",
]
# Every optional feature of every member package.
all = [
    "tacular-omics[mcp]",
    "mzmlpy[numpress,rapidgzip,zstd]>=0.10,<0.11",
    "tdfpy[viz]>=5.0,<6",
    "peptacular[interop]>=5.0,<6",
    "paftacular[all]>=2.0,<3",
    "spxtacular[all]>=0.9,<0.10",
]

[project.scripts]
tacular-omics = "tacular_omics.__main__:main"

[project.urls]
Homepage = "https://github.com/tacular-omics/tacular-omics"
Documentation = "https://github.com/tacular-omics/tacular-omics#readme"
Repository = "https://github.com/tacular-omics/tacular-omics"
Issues = "https://github.com/tacular-omics/tacular-omics/issues"
Changelog = "https://github.com/tacular-omics/tacular-omics/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Source, tests and paperwork only: no paper, docs, lockfile or repo tooling.
only-include = [
    "src/tacular_omics",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tacular_omics"]

[tool.hatch.version]
path = "src/tacular_omics/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "packaging>=24",
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/tacular_omics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
