[project]
name = "tacular-omics"
dynamic = ["version"]
description = "Install the tacular-omics proteomics packages together."
readme = "README.md"
requires-python = ">=3.12"
# The tested set of released member packages. Each has a floor (the release this set
# was tested with) and a cap (the next major, or next minor for 0.x packages).
dependencies = [
    "tacular>=1.2,<2",
    "psimodpy>=1.0,<2",
    "unimodpy>=1.0,<2",
    "uniprotptmpy>=1.0,<2",
    "fastatacular>=1.0,<2",
    "pefftacular>=1.0,<2",
    "mzmlpy>=0.9.3,<0.10",
    "tdfpy>=4.1.1,<5",
    "peptacular>=4.2,<5",
    "paftacular>=1.4,<2",
    "spxtacular>=0.8,<0.9",
]
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["proteomics", "mass spectrometry", "bioinformatics", "proforma", "mzml", "mzpaf", "fasta"]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The MCP servers of every member package that ships one.
mcp = [
    "psimodpy[server]>=1.0,<2",
    "unimodpy[server]>=1.0,<2",
    "uniprotptmpy[server]>=1.0,<2",
    "mzmlpy[mcp]>=0.9.3,<0.10",
    "tdfpy[mcp]>=4.1.1,<5",
    "peptacular[mcp]>=4.2,<5",
    "paftacular[mcp]>=1.4,<2",
]
# Every optional feature of every member package.
all = [
    "tacular-omics[mcp]",
    "mzmlpy[numpress,rapidgzip,zstd]>=0.9.3,<0.10",
    "tdfpy[viz]>=4.1.1,<5",
    "peptacular[interop]>=4.2,<5",
    "paftacular[all]>=1.4,<2",
    "spxtacular[all]>=0.8,<0.9",
]

[project.scripts]
tacular-omics = "tacular_omics.__main__:main"

[project.urls]
Homepage = "https://github.com/tacular-omics/tacular-omics"
Documentation = "https://github.com/tacular-omics/tacular-omics#readme"
Repository = "https://github.com/tacular-omics/tacular-omics"
Issues = "https://github.com/tacular-omics/tacular-omics/issues"
Changelog = "https://github.com/tacular-omics/tacular-omics/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacular_omics"]

[tool.hatch.version]
path = "src/tacular_omics/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "packaging>=24",
    "pytest>=9",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
