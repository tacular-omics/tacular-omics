# Standard tacular-omics CI (canonical copy: tacular-omics workspace templates/),
# adapted for the meta-package: the tests are install smoke tests, and the extra
# jobs install the built wheel into a fresh environment from PyPI, like a user would.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches a member release inside the caps that breaks the set.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests scripts/smoke.py
      - run: uv run ruff format --check src tests scripts/smoke.py
      - run: uv run ty check src
      - run: python scripts/release_version.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests

  # The floors are the tested releases: install exactly those.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct --all-groups
      - run: uv run pytest tests

  # Build the wheel, install it into a fresh environment from PyPI (no lock file,
  # newest versions inside the caps) and import every member.
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        extra: ["", "[all]"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: python scripts/release_version.py check --dist dist
      - name: Smoke test the built wheel outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          whl=$(ls "${{ github.workspace }}"/dist/*.whl)
          uv run --isolated --no-project --with "${whl}${{ matrix.extra }}" python "${{ github.workspace }}/scripts/smoke.py"
          uv run --isolated --no-project --with "${whl}${{ matrix.extra }}" python -m tacular_omics

  # Package-specific: branch coverage uploaded to Codecov. Report only, no threshold.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/tacular-omics
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/tacular-omics
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  # Same hooks contributors run at commit time (.pre-commit-config.yaml).
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx pre-commit run --all-files --show-diff-on-failure
